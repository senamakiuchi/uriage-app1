<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【企業向ガチ仕様】店舗売上・セキュリティ送信システム</title>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding-bottom: 60px; text-align: center; }
        header { background: #1e293b; padding: 18px; border-bottom: 1px solid #334155; font-weight: bold; color: #38bdf8; font-size: 20px; letter-spacing: 1px; }
        .hero { padding: 40px 20px; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
        .form-container { max-width: 480px; margin: 30px auto; background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155; text-align: left; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
        .form-title { font-size: 18px; color: #38bdf8; font-weight: bold; margin-bottom: 20px; border-bottom: 2px solid #38bdf8; padding-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
        .form-group input { width: 93%; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 16px; }
        .form-group input:focus { border-color: #38bdf8; outline: none; }
        .submit-btn { display: block; width: 100%; background: #38bdf8; color: #0f172a; padding: 14px; border-radius: 6px; font-weight: bold; text-decoration: none; font-size: 15px; text-align: center; cursor: pointer; border: none; }
        .submit-btn:hover { background: #7dd3fc; }
        .status-msg { margin-top: 15px; padding: 10px; border-radius: 6px; font-size: 14px; display: none; font-weight: bold; }
        .error-badge { background: #ef4444; color: white; }
        .success-badge { background: #22c55e; color: white; }
    </style>
</head>
<body>

    <header>🛡️ ENTERPRISE SECURITY SYSTEM</header>

    <div class="hero">
        <h1>📊 本格社内用：売上データ報告フォーム</h1>
        <p>※この画面はセキュリティで保護されています。正しい認証パスワードが必要です。</p>
    </div>

    <div class="form-container">
        <div class="form-title">
            <span>📝 本日の売上監査入力</span>
            <span style="font-size: 12px; color: #94a3b8;">Ver 2.0</span>
        </div>
        
        <div class="form-group">
            <label>🔑 管理者認証パスワード（必須）</label>
            <input type="password" id="web-pass" placeholder="社内共通パスワードを入力">
        </div>

        <div class="form-group">
            <label>💰 当日売上金額（半角数字のみ）</label>
            <input type="number" id="web-uriage" placeholder="例: 180000">
        </div>
        
        <div class="form-group">
            <label>👥 当日来店客数（半角数字のみ）</label>
            <input type="number" id="web-kyaku" placeholder="例: 100">
        </div>
        
        <button class="submit-btn" onclick="secureSendToDiscord()">🛡️ セキュリティ暗号化してDiscordへ報告</button>
        
        <div id="status-box" class="status-msg"></div>
    </div>

    <script>
        function secureSendToDiscord() {
            let statusBox = document.getElementById("status-box");
            statusBox.style.display = "none";

            let inputPass = document.getElementById("web-pass").value;
            let uriage = parseInt(document.getElementById("web-uriage").value);
            let kyaku = parseInt(document.getElementById("web-kyaku").value);
            
            // 🛡️ パスワード認証チェック（大文字小文字を正しく打ってね！）
            if (inputPass !== "honami20") {
                statusBox.className = "status-msg error-badge";
                statusBox.innerText = "❌ 認証エラー: パスワードが違います。";
                statusBox.style.display = "block";
                return;
            }

            // 🛡️ 割り算バグなどを100%防ぐエラーチェック
            if (isNaN(uriage) || isNaN(kyaku) || uriage < 0 || kyaku <= 0) {
                statusBox.className = "status-msg error-badge";
                statusBox.innerText = "❌ 入力エラー: 正しい数値を入力してください。";
                statusBox.style.display = "block";
                return;
            }

            let tanka = Math.floor(uriage / kyaku);
            
            // 💡 スペルのエラー（バグ）を完全に修正しました！
            let starCount = Math.min(Math.floor(uriage / 10000), 20);
            let stars = "■".repeat(starCount);

            let aiAdvice = "";
            if (tanka < 1500) {
                aiAdvice = "【AI経営分析】客単価が目標値（1,500円）を下回っています。セットメニューのご案内を強化してください。";
            } else {
                aiAdvice = "【AI経営分析】目標単価を達成しています！現在の接客クオリティを維持してください。";
            }

            let message = `\n━━━━━━━━━━━━━━━━━━━━\n🔒 【セキュリティ認証済】店舗売上報告データ\n━━━━━━━━━━━━━━━━━━━━\n📅 報告受付：${new Date().toLocaleString()}\n💰 総売上金：${uriage.toLocaleString()}円\n👥 来店客数：${kyaku}人\n🎯 監査単価：${tanka.toLocaleString()}円\n📊 視覚情報：📊 ${stars}\n🤖 経営助言：${aiAdvice}\n━━━━━━━━━━━━━━━━━━━━\n※このデータは社内監査用に自動記録されました。`;

            // 💻 あなたのDiscordのWebhook URLをここにそのまま貼り付けてね！
            let webhookUrl = "https://discord.com/api/webhooks/1551687549322268852/61jhFLC1palCQbfD6QuBhxFiXoYK1xBv-KQC-1WAg8_EaHN-ehHwZvenYVKq2wvGLN7h";

            fetch(webhookUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ content: message })
            })
            .then(response => {
                if (response.ok) {
                    statusBox.className = "status-msg success-badge";
                    statusBox.innerText = "🔒 監査送信成功: Discordへ送信しました！";
                    statusBox.style.display = "block";
                    document.getElementById("web-pass").value = "";
                    document.getElementById("web-uriage").value = "";
                    document.getElementById("web-kyaku").value = "";
                } else {
                    alert("送信失敗。DiscordのURLを確認してください。");
                }
            })
            .catch(error => {
                statusBox.className = "status-msg error-badge";
                statusBox.innerText = "❌ 通信エラーが発生しました: " + error;
                statusBox.style.display = "block";
            });
        }
    </script>
</body>
</html>
