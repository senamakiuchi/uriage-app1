<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【利益監査】店舗利益・人件費アナリティクスシステム</title>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0f19; color: #f8fafc; padding-bottom: 60px; text-align: center; }
        header { background: #1e293b; padding: 18px; border-bottom: 1px solid #334155; font-weight: bold; color: #38bdf8; font-size: 20px; letter-spacing: 1px; }
        .hero { padding: 40px 20px; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
        .form-container { max-width: 480px; margin: 30px auto; background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155; text-align: left; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
        .form-title { font-size: 18px; color: #38bdf8; font-weight: bold; margin-bottom: 20px; border-bottom: 2px solid #38bdf8; padding-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
        .form-group input { width: 93%; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 16px; }
        .form-group input:focus { border-color: #38bdf8; outline: none; }
        .submit-btn { display: block; width: 100%; background: #38bdf8; color: #0f172a; padding: 14px; border-radius: 6px; font-weight: bold; text-decoration: none; font-size: 15px; text-align: center; cursor: pointer; border: none; }
        .submit-btn:hover { background: #7dd3fc; }
        .status-msg { margin-top: 15px; padding: 10px; border-radius: 6px; font-size: 14px; display: none; font-weight: bold; }
        .error-badge { background: #ef4444; color: white; }
        .success-badge { background: #22c55e; color: white; }
    </style>
</head>
<body>

    <header>🛡️ ENTERPRISE PROFIT AUDIT SYSTEM</header>

    <div class="hero">
        <h1>📊 本格社内用：当日利益・人件費監査フォーム</h1>
        <p>※売上と総労働時間を入力するだけで、人件費・原価を引き算し、手元に残る【純利益】をAIがガチ分析します。</p>
    </div>

    <div class="form-container">
        <div class="form-title">
            <span>📝 本日の収支監査入力</span>
            <span style="font-size: 12px; color: #94a3b8;">Ver 4.0</span>
        </div>
        
        <!-- パスワード機能 -->
        <div class="form-group">
            <label>🔑 管理者認証パスワード（必須）</label>
            <input type="password" id="web-pass" placeholder="社内共通パスワードを入力">
        </div>

        <!-- 💡 利益を一発計算するための3つのリアル入力欄 -->
        <div class="form-group">
            <label>💰 1. 本日の総売上金額（円）</label>
            <input type="number" id="web-today" placeholder="例: 180000">
        </div>
        
        <div class="form-group">
            <label>⏳ 2. 本日の全スタッフの総労働時間（時間）</label>
            <input type="number" id="web-hours" placeholder="例: 25 （バイト全員の時間を足した合計）">
        </div>

        <div class="form-group">
            <label>🍜 3. お店の想定原価率（％）</label>
            <input type="number" id="web-cost-rate" value="35" placeholder="一般的な飲食店は30〜35％です">
        </div>
        
        <button class="submit-btn" onclick="calculateProfitAndSend()">🛡️ 利益を自動計算してDiscordへ報告</button>
        
        <div id="status-box" class="status-msg"></div>
    </div>

    <script>
        function calculateProfitAndSend() {
            let statusBox = document.getElementById("status-box");
            statusBox.style.display = "none";

            // 1. 入力されたデータをすべて読み取る
            let inputPass = document.getElementById("web-pass").value;
            let todayVal = parseInt(document.getElementById("web-today").value);
            let hoursVal = parseInt(document.getElementById("web-hours").value);
            let costRateVal = parseInt(document.getElementById("web-cost-rate").value);
            
            // 🛡️ パスワードチェック
            if (inputPass !== "honami20") {
                statusBox.className = "status-msg error-badge";
                statusBox.innerText = "❌ 認証エラー: パスワードが違います。";
                statusBox.style.display = "block";
                return;
            }

            // 🛡️ 入力エラーのガード
            if (isNaN(todayVal) || isNaN(hoursVal) || isNaN(costRateVal) || todayVal < 0 || hoursVal < 0 || costRateVal < 0 || costRateVal > 100) {
                statusBox.className = "status-msg error-badge";
                statusBox.innerText = "❌ 入力エラー: すべての項目を正しい数字で入力してください。";
                statusBox.style.display = "block";
                return;
            }

            // 💡 【新機能：人件費・原価・純利益のリアル自動計算！】
            // ① 平均時給を「1,100円」と仮定して、今日の人件費の合計を出す
            let jinkenhi = hoursVal * 1100;

            // ② 入力された原価率（％）を使って、今日の食材費（原価）を出す
            let genka = Math.floor(todayVal * (costRateVal / 100));

            // ③ 売上から「人件費」と「原価」をすべて引き算して、手元に残る【純利益】を割り出す！
            let netProfit = todayVal - jinkenhi - genka;

            // ④ 売上に対する純利益の割合（利益率％）を出す
            let profitRate = todayVal > 0 ? Math.floor((netProfit / todayVal) * 100) : 0;

            // 💡 【ご要望：AIアドバイスのガチ分析化！】
            // 手元に残った「利益率の％」をベースに、AIがお店の経営状態を本気で診断します
            let aiAdvice = "";
            if (profitRate >= 40) {
                aiAdvice = "🔥【AI最高評価: 利益爆発】利益率が40%を超える驚異的な超黒字営業です！無駄な人件費を極限まで抑えつつ、最高の効率でお店を回せています。このシフト配置とオペレーションは理想郷です。店長・スタッフ全員を大絶賛してください！";
            } else if (profitRate >= 20) {
                aiAdvice = "✨【AI優良評価: 安定黒字】利益率20%〜39%の、非常に健全で素晴らしい黒字運営です。人件費のコントロールと売上のバランスが完璧に噛み合っています。この調子を維持していきましょう！";
            } else if (profitRate >= 0) {
                aiAdvice = "⚠️【AI注意報: 薄利営業】手元に利益は残っていますが、利益率が20%未満と少し寂しい状態です。売上に対してスタッフの数が多すぎた（シフトが過剰だった）可能性があります。ピークタイム以外の時間を早上がりにするなど、人件費の微調整を検討してください。";
            } else {
                aiAdvice = "🚨【AI危険信号: 赤字経営】本日の営業は赤字です！売上に対して、人件費（スタッフの労働時間）または原価がかかりすぎています。至急、シフトの組み方を見直すか、廃棄ロス（食材のムダ）が出ていないか明日の営業前に緊急監査を行ってください！";
            }

            // 📊 視覚的な進捗グラフ（残った利益率の大きさに合わせて伸びる！）
            let starCount = Math.min(Math.max(Math.floor(profitRate / 5), 1), 20);
            let stars = profitRate >= 0 ? "■".repeat(starCount) : "❌（赤字のためグラフ表示不可）";

            // 3. 企業向けの高度な利益報告フォーマット
            let message = `\n━━━━━━━━━━━━━━━━━━━━\n🔒 【収支・利益監査】当日純利益アナリティクス\n━━━━━━━━━━━━━━━━━━━━\n📅 報告受付：${new Date().toLocaleString()}\n💰 当日売上：${todayVal.toLocaleString()}円\n⏳ 総労働時：${hoursVal} 時間 (概算人件費: ${jinkenhi.toLocaleString()}円)\n🍜 食材原価：${genka.toLocaleString()}円 (原価率: ${costRateVal}％)\n\n💵 💵 💵 💵 💵 💵 💵 💵 💵\n💵 確定純利益：${netProfit.toLocaleString()}円\n💵 当日利益率：${profitRate}％\n💵 💵 💵 💵 💵 💵 💵 💵 💵\n\n📊 利益グラフ：${stars}\n🧠 経営コンサル助言：\n${aiAdvice}\n━━━━━━━━━━━━━━━━━━━━\n※このデータは社内監査用に自動記録されました。`;

            // 💻 あなたのDiscordのWebhook URLをここにそのまま貼り付けてね！
            let webhookUrl = "https://discord.com/api/webhooks/1551676045495631892/Tl8plY9cre2lnI5x7HZY-7v9j1TArRl3PIwnUJydY3A61LxTiY8FF3YUgJXxW78V5Anf";

            fetch(webhookUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ content: message })
            })
            .then(response => {
                if (response.ok) {
                    statusBox.className = "status-msg success-badge";
                    statusBox.innerText = "🔒 監査成功: 確定利益データをDiscordへ暗号化送信しました！";
                    statusBox.style.display = "block";
                    // 入力欄をクリア
                    document.getElementById("web-pass").value = "";
                    document.getElementById("web-today").value = "";
                    document.getElementById("web-hours").value = "";
                } else {
                    alert("送信失敗。DiscordのURLを確認してください。");
                }
            })
            .catch(error => {
                statusBox.className = "status-msg error-badge";
                statusBox.innerText = "❌ 通信エラーが発生しました: " + error;
                statusBox.style.display = "block";
            });
        }
    </script>
</body>
</html>
