<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【ガチ経営分析】店舗売上・高度アナリティクスシステム</title>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0f19; color: #f8fafc; padding-bottom: 60px; text-align: center; }
        header { background: #1e293b; padding: 18px; border-bottom: 1px solid #334155; font-weight: bold; color: #38bdf8; font-size: 20px; letter-spacing: 1px; }
        .hero { padding: 40px 20px; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
        .form-container { max-width: 480px; margin: 30px auto; background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155; text-align: left; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
        .form-title { font-size: 18px; color: #38bdf8; font-weight: bold; margin-bottom: 20px; border-bottom: 2px solid #38bdf8; padding-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
        .form-group input { width: 93%; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 16px; }
        .form-group input:focus { border-color: #38bdf8; outline: none; }
        .submit-btn { display: block; width: 100%; background: #38bdf8; color: #0f172a; padding: 14px; border-radius: 6px; font-weight: bold; text-decoration: none; font-size: 15px; text-align: center; cursor: pointer; border: none; }
        .submit-btn:hover { background: #7dd3fc; }
        .status-msg { margin-top: 15px; padding: 10px; border-radius: 6px; font-size: 14px; display: none; font-weight: bold; }
        .error-badge { background: #ef4444; color: white; }
        .success-badge { background: #22c55e; color: white; }
    </style>
</head>
<body>

    <header>🛡️ ENTERPRISE ANALYTICS SYSTEM</header>

    <div class="hero">
        <h1>📊 高度社内用：売上成長率・分析アナリティクス</h1>
        <p>※前日データ・前月比を自動計算し、AIが経営アドバイスをガチ分析します。</p>
    </div>

    <div class="form-container">
        <div class="form-title">
            <span>📝 本日の売上データ監査</span>
            <span style="font-size: 12px; color: #94a3b8;">Ver 3.0</span>
        </div>
        
        <!-- パスワード機能はそのまま維持！ -->
        <div class="form-group">
            <label>🔑 管理者認証パスワード（必須）</label>
            <input type="password" id="web-pass" placeholder="社内共通パスワードを入力">
        </div>

        <!-- 💡 データの信憑性を上げるための「確実な売上3項目」の入力欄 -->
        <div class="form-group">
            <label>💰 1. 本日の売上金額（円）</label>
            <input type="number" id="web-today" placeholder="例: 180000">
        </div>
        
        <div class="form-group">
            <label>📉 2. 前日の売上金額（円）</label>
            <input type="number" id="web-yesterday" placeholder="例: 150000">
        </div>

        <div class="form-group">
            <label>📅 3. 先月の月間総売上（円）</label>
            <input type="number" id="web-lastmonth" placeholder="例: 4500000">
        </div>
        
        <button class="submit-btn" onclick="analyzeAndSend()">🛡️ 売上をガチ分析してDiscordへ報告</button>
        
        <div id="status-box" class="status-msg"></div>
    </div>

    <script>
        function analyzeAndSend() {
            let statusBox = document.getElementById("status-box");
            statusBox.style.display = "none";

            let inputPass = document.getElementById("web-pass").value;
            let todayVal = parseInt(document.getElementById("web-today").value);
            let yesterdayVal = parseInt(document.getElementById("web-yesterday").value);
            let lastMonthVal = parseInt(document.getElementById("web-lastmonth").value);
            
            // 🛡️ パスワードチェック
            if (inputPass !== "honami20") {
                statusBox.className = "status-msg error-badge";
                statusBox.innerText = "❌ 認証エラー: パスワードが違います。";
                statusBox.style.display = "block";
                return;
            }

            // 🛡️ 入力エラーのガード
            if (isNaN(todayVal) || isNaN(yesterdayVal) || isNaN(lastMonthVal) || todayVal < 0 || yesterdayVal <= 0 || lastMonthVal <= 0) {
                statusBox.className = "status-msg error-badge";
                statusBox.innerText = "❌ 入力エラー: すべての売上を正しい数字で入力してください。";
                statusBox.style.display = "block";
                return;
            }

            // 💡 【新機能：前日比・前月比％の自動計算】
            // 今日の売上が、前日や先月平均（30日分割）と比べて何％アップ・ダウンしたかを計算
            let dayPercent = Math.floor((todayVal / yesterdayVal) * 100);
            let dayDiff = dayPercent - 100;
            let dayResultText = dayDiff >= 0 ? `前日比：${dayDiff}%アップ 📈` : `前日比：${Math.abs(dayDiff)}%ダウン 📉`;

            let lastMonthDayAvg = lastMonthVal / 30; // 先月の1日平均売上
            let monthPercent = Math.floor((todayVal / lastMonthDayAvg) * 100);
            let monthDiff = monthPercent - 100;
            let monthResultText = monthDiff >= 0 ? `先月平均比：${monthDiff}%アップ 📈` : `先月平均比：${Math.abs(monthDiff)}%ダウン 📉`;

            // 💡 【ご要望：AIアドバイスのガチ分析化！】
            // 同じコメントばかりにならないよう、前日比と前月比の「組み合わせパターン」で詳細に分岐させました！
            let aiAdvice = "";
            if (dayDiff >= 10 && monthDiff >= 10) {
                aiAdvice = "🔥【AI超高評価】前日比・先月比ともに10%以上プラスの大躍進です！今日行った販促や、おすすめメニューの提案が完全に客層にハマっています。この成功パターンをマニュアル化し、チーム全員に即共有してください！";
            } else if (dayDiff >= 0 && monthDiff >= 0) {
                aiAdvice = "✨【AI安定評価】前日・先月平均をしっかり上回り、非常に健全な売上推移です。大きなトラブルもなく、安定した店舗運営ができています。リピーターをより強固にするため、次回使えるクーポンのアプローチを続けましょう。";
            } else if (dayDiff < 0 && monthDiff >= 0) {
                aiAdvice = "⚠️【AI注意報】先月平均のペースは維持していますが、前日より売上が下がっています。曜日ごとの波、または天候の影響が考えられます。客単価を補うための『あと1品』のおすすめセット提案を意識してください。";
            } else if (dayDiff >= 0 && monthDiff < 0) {
                aiAdvice = "📊【AIリカバリー評価】前日からは見事に売上を回復させましたが、先月平均のペースにはまだ届いていません。全体の来客基盤が少し弱まっている可能性があるため、SNS発信や看板メニューの露出を増やして新規開拓を狙いましょう。";
            } else {
                aiAdvice = "🚨【AI警告】前日比・先月比ともに減少する危険信号です。速やかに今日の『時間帯別の売上動向』を確認してください。ピークタイムの取りこぼしがなかったか、ロスが出ていないか、明日の営業前に緊急で見直しが必要です。";
            }

            // 📊 視覚的な進捗グラフ（前日比の％の大きさに合わせて伸びる！）
            let starCount = Math.min(Math.max(Math.floor(dayPercent / 10), 1), 20);
            let stars = "■".repeat(starCount);

            // 3. 企業向けの高度なDiscord報告フォーマット
            let message = `\n━━━━━━━━━━━━━━━━━━━━\n🔒 【高度売上監査】前日・前月比アナリティクス\n━━━━━━━━━━━━━━━━━━━━\n📅 報告受付：${new Date().toLocaleString()}\n💰 当日売上：${todayVal.toLocaleString()}円\n📊 日次判定：${dayResultText} (${dayPercent}%)\n月次判定：${monthResultText} (${monthPercent}%)\n📈 成長推移：📊 ${stars}\n🧠 経営コンサル助言：\n${aiAdvice}\n━━━━━━━━━━━━━━━━━━━━\n※このデータは社内監査用に自動記録されました。`;

            // 💻 あなたのDiscordのWebhook URLをここにそのまま貼り付けてね！
            let webhookUrl = "https://discord.com";

            fetch(webhookUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ content: message })
            })
            .then(response => {
                if (response.ok) {
                    statusBox.className = "status-msg success-badge";
                    statusBox.innerText = "🔒 送信成功: 高度分析データをDiscordへ送信しました！";
                    statusBox.style.display = "block";
                    // 入力欄をクリア
                    document.getElementById("web-pass").value = "";
                    document.getElementById("web-today").value = "";
                    document.getElementById("web-yesterday").value = "";
                    document.getElementById("web-lastmonth").value = "";
                } else {
                    alert("送信失敗。DiscordのURLを確認してください。");
                }
            })
            .catch(error => {
                statusBox.className = "status-msg error-badge";
                statusBox.innerText = "❌ 通信エラーが発生しました: " + error;
                statusBox.style.display = "block";
            });
        }
    </script>
</body>
</html>
